<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ICT Service Request</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-mark">IT</div>
      <h1>ICT Service Request System</h1>
    </div>
    <button id="logoutBtn">Log out</button>
  </header>

  <main>
    <section class="dashboard">
      <div class="stat total">
        <span class="stat-value" id="totalCount">0</span>
        <span class="stat-label">Total requests</span>
      </div>
      <div class="stat pending">
        <span class="stat-value" id="pendingCount">0</span>
        <span class="stat-label">Pending</span>
      </div>
      <div class="stat inprogress">
        <span class="stat-value" id="inprogressCount">0</span>
        <span class="stat-label">In progress</span>
      </div>
      <div class="stat completed">
        <span class="stat-value" id="completedCount">0</span>
        <span class="stat-label">Completed</span>
      </div>
    </section>

    <section class="controls">
      <button id="newRequestBtn">+ New request</button>
      <input id="searchInput" placeholder="Search requester, category, status, priority, or date">
      <select id="statusFilter">
        <option value="">All status</option>
        <option>Pending</option>
        <option>In Progress</option>
        <option>Completed</option>
      </select>
      <select id="priorityFilter">
        <option value="">All priority</option>
        <option>Low</option>
        <option>Medium</option>
        <option>High</option>
      </select>
    </section>

    <section>
      <table id="requestsTable">
        <thead>
          <tr><th>ID</th><th>Requester</th><th>Category</th><th>Description</th><th>Priority</th><th>Status</th><th>Date</th><th>Action</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <div id="modal" class="modal hidden">
    <form id="requestForm" class="modal-content">
      <h2 id="formTitle">New Request</h2>
      <input type="hidden" id="requestId">
      <label>Requester name<input id="requester" required></label>
      <label>Department<input id="department" required></label>
      <label>Category<select id="category">
        <option>Computer repair</option>
        <option>Software installation</option>
        <option>Internet/network problem</option>
        <option>Printer problem</option>
        <option>Account/access concern</option>
        <option>Other</option>
      </select></label>
      <label>Description<textarea id="description" required></textarea></label>
      <label>Priority<select id="priority">
        <option>Low</option>
        <option>Medium</option>
        <option>High</option>
      </select></label>
      <label>Status<select id="status">
        <option>Pending</option>
        <option>In Progress</option>
        <option>Completed</option>
      </select></label>
      <div class="form-actions">
        <button type="button" id="cancelBtn">Cancel</button>
        <button type="submit">Save</button>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.33.0/dist/umd/supabase.min.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js?v=3"></script>
</body>
</html>
