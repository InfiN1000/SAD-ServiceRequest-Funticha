<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login - ICT Service Request</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="brand-mark">IT</div>
      <h2>ICT Service Request System</h2>
      <p class="subtitle">Sign in to manage support requests.</p>
      <form id="loginForm">
        <label>Email<input id="email" type="email" required autocomplete="username"></label>
        <label>Password<input id="password" type="password" required autocomplete="current-password"></label>
        <button type="submit">Log in</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.33.0/dist/umd/supabase.min.js"></script>
  <script src="js/supabase.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    // redirect if already logged in
    (async ()=>{
      const sb = window.supabaseClient;
      if (!sb) return;
      const { data } = await sb.auth.getUser();
      if (data?.user) window.location.href = 'index.html';
    })();

    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const sb = window.supabaseClient;
      if (!sb) return alert('Supabase client not initialized');
      const { error } = await sb.auth.signInWithPassword({email,password});
      if (error) return alert('Login failed: '+error.message);
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
